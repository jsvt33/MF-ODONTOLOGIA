  $i('s2b')?.addEventListener('click',()=>{S.step=1;render()});
  $i('s2s')?.addEventListener('click',()=>{if(S.spec&&S.urg&&S.desc.trim().length>10)submit()});
  $i('bR')?.addEventListener('click',()=>{Object.assign(S,{step:0,nome:'',email:'',tel:'',spec:null,urg:null,desc:'',resp:''});render()});
}
async function submit(){
  S.step=3;render();
  const sp=SPECS.find(s=>s.key===S.spec);
  const ur=URGENCY.find(u=>u.value===S.urg);
  let ai='';
  try{
    const r=await fetch('/api/claude',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({system:SYS,messages:[{role:'user',content:'Nome: '+S.nome+'\nÁrea: '+(sp?.label||'Geral')+'\nUrgência: '+(ur?.label||'-')+'\nDescrição: '+S.desc}]})
    });
    const d=await r.json();
    ai=d.content?.map(b=>b.text||'').join('')||'';
    if(!ai)throw new Error('vazio');
  }catch(e){
    ai='Olá, '+S.nome+'! 😊\n\nRecebi sua mensagem. O Dr. Marcel está pronto para te atender pessoalmente.\n\n**Entre em contato pelo WhatsApp** e agende o melhor horário. Seu sorriso merece cuidado real!';
  }
  S.resp=ai;
  try{
    emailjs.init(CONFIG.EMAILJS_PUBLIC_KEY);
    await emailjs.send(CONFIG.EMAILJS_SERVICE_ID,CONFIG.EMAILJS_TEMPLATE_ID,{
      to_email:CONFIG.SEU_EMAIL,lead_nome:S.nome||'-',lead_email:S.email||'-',lead_tel:S.tel||'-',
      lead_area:sp?.label||'-',lead_urg:ur?.label||'-',lead_desc:S.desc,lead_resp:ai,
      data_hora:new Date().toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})
    });
    showToast('✦ Lead registrado!');
  }catch(e){console.warn('EmailJS:',e)}
  S.step=4;render();
}
$i('btnAbrirConsulta').addEventListener('click',()=>{S.step=0;render();$i('modalOverlay').classList.add('open');document.body.style.overflow='hidden'});
$i('modalOverlay').addEventListener('click',e=>{if(e.target===$i('modalOverlay')){$i('modalOverlay').classList.remove('open');document.body.style.overflow=''}});
document.getElementById('photo').src='https://raw.githubusercontent.com/jsvt33/MF-ODONTOLOGIA/main/IMG-20260518-WA0077-convertido-de-jpg.jpeg';
</script>
