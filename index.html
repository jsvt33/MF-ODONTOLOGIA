  if(S.step===1)mi.innerHTML=screen1();
  if(S.step===2)mi.innerHTML=screen2();
  if(S.step===3)mi.innerHTML=screen3();
  if(S.step===4)mi.innerHTML=screen4();
  bind();
}

/* ─── EVENTOS ─── */
function bind(){
  /* step 0 */
  $i('s0next')?.addEventListener('click',()=>{S.step=1;render()});
  /* step 1 */
  const iNome=$i('iNome'),iEmail=$i('iEmail'),iTel=$i('iTel'),s1n=$i('s1next');
  iNome?.addEventListener('input',e=>{S.nome=e.target.value;if(s1n)s1n.disabled=S.nome.trim().length<2});
  iEmail?.addEventListener('input',e=>S.email=e.target.value);
  iTel?.addEventListener('input',e=>S.tel=e.target.value);
  s1n?.addEventListener('click',()=>{if(S.nome.trim().length>=2){S.step=2;render()}});
  /* step 2 */
  document.querySelectorAll('.spec-btn').forEach(b=>b.addEventListener('click',()=>{S.spec=b.dataset.spec;render()}));
  document.querySelectorAll('.urg-btn').forEach(b=>b.addEventListener('click',()=>{S.urg=b.dataset.urg;render()}));
  $i('iDesc')?.addEventListener('input',e=>{S.desc=e.target.value;const s=$i('s2submit');if(s)s.disabled=!(S.spec&&S.urg&&S.desc.trim().length>10)});
  $i('s2back')?.addEventListener('click',()=>{S.step=1;render()});
  $i('s2submit')?.addEventListener('click',()=>{if(S.spec&&S.urg&&S.desc.trim().length>10)submit()});
  /* step 4 */
  $i('btnReset')?.addEventListener('click',()=>{Object.assign(S,{step:0,nome:'',email:'',tel:'',spec:null,urg:null,desc:'',resp:''});render()});

/* ─── SUBMIT ─── */
async function submit(){
  S.step=3;render();
  const spec=SPECS.find(s=>s.key===S.spec);
  const urg=URGENCY.find(u=>u.value===S.urg);
  let ai='';
  try{
const headers={'Content-Type':'application/json'};
    const r=await fetch('/.netlify/functions/claude',{
      method:'POST',headers,
      body:JSON.stringify({
        
        system:SYS,
        messages:[{role:'user',content:`Nome do paciente: ${S.nome}\nÁrea de interesse: ${spec?.label||'Geral'}\nNível de urgência: ${urg?.label||'-'}\nDescrição completa do paciente: ${S.desc}`}]
      })
    });
    const d=await r.json();
    if(d.error){throw new Error(d.error.message||'API error')}
    ai=d.content?.map(b=>b.text||'').join('')||'';
    if(!ai) throw new Error('Resposta vazia');
  }catch(e){
    console.error('Erro API:',e);
    ai=`Olá, ${S.nome||'paciente'}! 😊\n\nRecebi sua mensagem e entendo a sua preocupação. Infelizmente estou com uma instabilidade técnica no momento para processar sua orientação completa.\n\nMas não se preocupe — o Dr. Marcel está pronto para te atender pessoalmente e entender sua situação com toda a atenção que você merece.\n\n**Entre em contato agora pelo WhatsApp** e vamos agendar o melhor horário para você. Seu sorriso merece cuidado real. Vamos conversar pessoalmente?`;
  }
  S.resp=ai;
  try{
    emailjs.init(CONFIG.EMAILJS_PUBLIC_KEY);
    await emailjs.send(CONFIG.EMAILJS_SERVICE_ID,CONFIG.EMAILJS_TEMPLATE_ID,{
      to_email:CONFIG.SEU_EMAIL,lead_nome:S.nome||'-',lead_email:S.email||'-',lead_tel:S.tel||'-',
      lead_area:spec?.label||'-',lead_urg:urg?.label||'-',lead_desc:S.desc,lead_resp:ai,
      data_hora:new Date().toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})
    });
    toast('✦ Lead registrado com sucesso!');
  }catch(e){console.warn('EmailJS não configurado:',e)}
  S.step=4;render();
}

/* ─── MODAL OPEN/CLOSE ─── */
$i('btnAbrirConsulta').addEventListener('click',()=>{
  S.step=0;render();
  $i('modalOverlay').classList.add('open');
  document.body.style.overflow='hidden';
});
$i('modalOverlay').addEventListener('click',e=>{
  if(e.target===$i('modalOverlay')){fecharModal()}
});
function fecharModal(){$i('modalOverlay').classList.remove('open');document.body.style.overflow=''}
